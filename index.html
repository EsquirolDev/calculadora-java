<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .tarjeta {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    h1 { font-size: 1.6rem; margin-bottom: 6px; }

    .aviso { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }

    form { display: flex; flex-direction: column; gap: 14px; }

    label { font-size: 0.85rem; color: #94a3b8; }

    input, select {
      width: 100%;
      padding: 12px 14px;
      margin-top: 4px;
      font-size: 1rem;
      color: #e2e8f0;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus { border-color: #38bdf8; }

    button {
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
      background: #38bdf8;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: #7dd3fc; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <main class="tarjeta">
    <h1>Calculadora</h1>
    <p class="aviso">Solo enteros entre -99999 y 99999.</p>
    <form action="/calcular" method="get">
      <label>Primer número
        <input type="number" name="a" min="-99999" max="99999" step="1" required>
      </label>
      <label>Operación
        <select name="op">
          <option value="suma">+ (suma)</option>
          <option value="resta">- (resta)</option>
          <option value="multiplicacion">× (multiplicación)</option>
          <option value="potencia">^ (potencia)</option>
        </select>
      </label>
      <label>Segundo número
        <input type="number" name="b" min="-99999" max="99999" step="1" required>
      </label>
      <button type="submit">Calcular</button>
    </form>
  </main>
</body>
</html>
